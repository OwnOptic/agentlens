<svg viewBox="0 0 920 462" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">AgentLens request flow</title>
  <desc id="desc">
    Microsoft 365 Copilot calls the declarative agent, which calls the AgentLens MCP server.
    The server validates the inbound call using the AgentLens-MCP app registration, then reads
    six Microsoft APIs read-only using the separate AgentLens-Reader service principal: Azure
    Resource Graph, Microsoft Graph, the Power Platform admin and governance APIs, Dataverse for
    aggregate usage, the Power Platform licensing API for per-agent consumption, and Azure Cost
    Management for billed spend. The MCP server itself holds no data permissions.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2A3B4E"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F26F21"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7A8F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="462" fill="#FFFFFF"/>

  <!-- Row 1: Copilot -> Agent -> MCP server -->
  <g font-size="14">
    <rect x="20" y="20" width="170" height="56" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="105" y="43" text-anchor="middle" fill="#2A3B4E" font-weight="600">Microsoft 365</text>
    <text x="105" y="61" text-anchor="middle" fill="#2A3B4E" font-weight="600">Copilot</text>

    <line x1="190" y1="48" x2="238" y2="48" stroke="#2A3B4E" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="240" y="20" width="190" height="56" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="335" y="43" text-anchor="middle" fill="#2A3B4E" font-weight="600">Declarative agent</text>
    <text x="335" y="61" text-anchor="middle" fill="#6B7A8F" font-size="12">agent/appPackage</text>

    <line x1="430" y1="48" x2="478" y2="48" stroke="#2A3B4E" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="480" y="20" width="220" height="56" rx="10" fill="#2A3B4E"/>
    <text x="590" y="43" text-anchor="middle" fill="#FFFFFF" font-weight="600">AgentLens MCP server</text>
    <text x="590" y="61" text-anchor="middle" fill="#C9D2DD" font-size="12">src/  ·  Container App, scale-to-zero</text>
  </g>

  <!-- Inbound auth callout -->
  <g font-size="12">
    <line x1="700" y1="48" x2="768" y2="48" stroke="#6B7A8F" stroke-width="1.25" stroke-dasharray="3 3" marker-end="url(#arrowMuted)"/>
    <rect x="770" y="22" width="130" height="52" rx="8" fill="#FFFFFF" stroke="#6B7A8F" stroke-width="1.25" stroke-dasharray="3 3"/>
    <text x="835" y="42" text-anchor="middle" fill="#4A5568" font-weight="600">AgentLens-MCP</text>
    <text x="835" y="57" text-anchor="middle" fill="#6B7A8F" font-size="10.5">validates the caller</text>
    <text x="835" y="69" text-anchor="middle" fill="#6B7A8F" font-size="10.5">holds no data access</text>
  </g>

  <!-- MCP server down to the Reader identity -->
  <line x1="590" y1="76" x2="590" y2="112" stroke="#2A3B4E" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="480" y="114" width="220" height="50" rx="10" fill="#F26F21" fill-opacity="0.12" stroke="#F26F21" stroke-width="1.5"/>
  <text x="590" y="135" text-anchor="middle" fill="#B5540E" font-weight="600" font-size="14">AgentLens-Reader</text>
  <text x="590" y="152" text-anchor="middle" fill="#8A5A2E" font-size="11.5">client credentials · read-only everywhere</text>

  <!-- Reader fans out along a horizontal bus to six sources, three columns x two rows -->
  <line x1="590" y1="164" x2="590" y2="188" stroke="#F26F21" stroke-width="1.5"/>
  <line x1="120" y1="188" x2="590" y2="188" stroke="#F26F21" stroke-width="1.5"/>
  <line x1="230" y1="188" x2="230" y2="298" stroke="#F26F21" stroke-width="1.5"/>
  <line x1="120" y1="298" x2="570" y2="298" stroke="#F26F21" stroke-width="1.5"/>

  <!-- Row A: three drops from the bus, at each column's centre (120 / 340 / 570) -->
  <line x1="120" y1="188" x2="120" y2="216" stroke="#F26F21" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <line x1="340" y1="188" x2="340" y2="216" stroke="#F26F21" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <line x1="570" y1="188" x2="570" y2="216" stroke="#F26F21" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

  <g font-size="13">
    <rect x="20" y="218" width="200" height="66" rx="10" fill="#FFFFFF" stroke="#2A3B4E" stroke-width="1.25"/>
    <text x="120" y="241" text-anchor="middle" fill="#2A3B4E" font-weight="600">Azure Resource Graph</text>
    <text x="120" y="259" text-anchor="middle" fill="#6B7A8F" font-size="11">Copilot Studio +</text>
    <text x="120" y="273" text-anchor="middle" fill="#6B7A8F" font-size="11">Agent Builder agents</text>

    <rect x="240" y="218" width="200" height="66" rx="10" fill="#FFFFFF" stroke="#2A3B4E" stroke-width="1.25"/>
    <text x="340" y="241" text-anchor="middle" fill="#2A3B4E" font-weight="600">Microsoft Graph</text>
    <text x="340" y="259" text-anchor="middle" fill="#6B7A8F" font-size="11">owner names,</text>
    <text x="340" y="273" text-anchor="middle" fill="#6B7A8F" font-size="11">M365 agent registry</text>

    <rect x="460" y="218" width="220" height="66" rx="10" fill="#FFFFFF" stroke="#2A3B4E" stroke-width="1.25"/>
    <text x="570" y="241" text-anchor="middle" fill="#2A3B4E" font-weight="600">Power Platform admin</text>
    <text x="570" y="259" text-anchor="middle" fill="#6B7A8F" font-size="11">environments +</text>
    <text x="570" y="273" text-anchor="middle" fill="#6B7A8F" font-size="11">DLP governance</text>
  </g>

  <!-- Row B: three more drops, straight down from row A into row B -->
  <line x1="120" y1="298" x2="120" y2="312" stroke="#F26F21" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <line x1="340" y1="298" x2="340" y2="312" stroke="#F26F21" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <line x1="570" y1="298" x2="570" y2="312" stroke="#F26F21" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

  <g font-size="13">
    <rect x="20" y="314" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#2A3B4E" stroke-width="1.25"/>
    <text x="120" y="337" text-anchor="middle" fill="#2A3B4E" font-weight="600">Dataverse</text>
    <text x="120" y="355" text-anchor="middle" fill="#6B7A8F" font-size="11">aggregate conversation</text>
    <text x="120" y="369" text-anchor="middle" fill="#6B7A8F" font-size="11">KPIs only</text>

    <rect x="240" y="314" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#2A3B4E" stroke-width="1.25"/>
    <text x="340" y="337" text-anchor="middle" fill="#2A3B4E" font-weight="600">PP licensing API</text>
    <text x="340" y="355" text-anchor="middle" fill="#6B7A8F" font-size="11">per-agent messages,</text>
    <text x="340" y="369" text-anchor="middle" fill="#6B7A8F" font-size="11">capacity</text>

    <rect x="460" y="314" width="220" height="70" rx="10" fill="#FFFFFF" stroke="#2A3B4E" stroke-width="1.25"/>
    <text x="570" y="337" text-anchor="middle" fill="#2A3B4E" font-weight="600">Azure Cost Management</text>
    <text x="570" y="355" text-anchor="middle" fill="#6B7A8F" font-size="11">real billed spend +</text>
    <text x="570" y="369" text-anchor="middle" fill="#6B7A8F" font-size="11">Microsoft's forecast</text>
  </g>

  <!-- legend, to the right of the source grid -->
  <g font-size="11.5">
    <rect x="700" y="188" width="200" height="196" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <text x="716" y="212" fill="#2A3B4E" font-weight="700" font-size="12.5">Read-only, always</text>
    <text x="716" y="232" fill="#4A5568">No tool issues a POST,</text>
    <text x="716" y="247" fill="#4A5568">PATCH or DELETE</text>
    <text x="716" y="262" fill="#4A5568">against any of these.</text>

    <text x="716" y="292" fill="#2A3B4E" font-weight="700" font-size="12.5">Unreadable ≠ zero</text>
    <text x="716" y="312" fill="#4A5568">A source that could not</text>
    <text x="716" y="327" fill="#4A5568">be read is reported as</text>
    <text x="716" y="342" fill="#4A5568">not_connected, never</text>
    <text x="716" y="357" fill="#4A5568">folded into a count.</text>

    <text x="716" y="377" fill="#4A5568" font-size="10.5">docs/architecture/ARCHITECTURE.md</text>
  </g>
  <!-- Elliot Margot brand footer -->
  <line x1="0" y1="422" x2="920" y2="422" stroke="#e5e7eb" stroke-width="1"/>
  <g transform="translate(20,430) scale(0.24)">
    <path d="M15 15H30V85H15z M15 15H50V30H15z M15 42.5H45V57.5H15z M15 70H50V85H15z" fill="#F26F21"/>
    <path d="M55 85V15L75 50L95 15V85" stroke="#2A3B4E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="52" y="447" font-size="12" fill="#4b5563">AgentLens &#183; Elliot Margot &#183; e-margot.ch</text>
  <text x="900" y="447" font-size="11" fill="#94a3b8" text-anchor="end">docs/assets/diagrams/architecture.svg</text>
</svg>
