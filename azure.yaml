# Azure Developer CLI configuration.
#
#   azd auth login
#   azd up            provision + build + deploy, then prints AGENTLENS_MCP_URL
#
# Docs: https://learn.microsoft.com/azure/developer/azure-developer-cli/

name: agentlens
metadata:
  template: agentlens@0.2.0

infra:
  provider: bicep
  path: infra
  module: main

services:
  mcp:
    project: .
    language: js
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
